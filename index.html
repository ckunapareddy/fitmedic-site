<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitMedic — Coming Soon</title>
<meta name="description" content="FitMedic is coming soon.">
<style>
  :root {
    --bg: #0b1220;
    --bg-2: #101a2c;
    --accent: #3ecf8e;
    --accent-2: #4ea1ff;
    --text: #f3f6fa;
    --text-dim: #9aa7bd;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(78,161,255,0.18), transparent 60%),
      radial-gradient(1000px 500px at 110% 10%, rgba(62,207,142,0.16), transparent 55%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .wordmark {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--text-dim);
    margin-bottom: 48px;
    opacity: 0;
    animation: fadeIn 0.8s ease-out forwards;
  }
  .wordmark .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  h1 {
    font-size: clamp(2.4rem, 7vw, 4.5rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 16px;
    background: linear-gradient(135deg, #ffffff 20%, var(--accent-2) 60%, var(--accent) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    opacity: 0;
    animation: fadeIn 0.8s ease-out 0.15s forwards;
  }
  p.tagline {
    font-size: clamp(1rem, 2.2vw, 1.25rem);
    color: var(--text-dim);
    max-width: 34rem;
    margin: 0 0 40px;
    line-height: 1.6;
    opacity: 0;
    animation: fadeIn 0.8s ease-out 0.3s forwards;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(6px);
    font-size: 0.95rem;
    color: var(--text);
    opacity: 0;
    animation: fadeIn 0.8s ease-out 0.45s forwards;
  }
  .pill .pulse {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 rgba(62,207,142,0.6);
    animation: pulse 2s infinite;
  }
  a.mail {
    color: var(--accent-2);
    text-decoration: none;
    font-weight: 600;
  }
  a.mail:hover { text-decoration: underline; }
  footer {
    position: absolute;
    bottom: 28px;
    font-size: 0.8rem;
    color: #5c6a82;
    opacity: 0;
    animation: fadeIn 0.8s ease-out 0.6s forwards;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(62,207,142,0.55); }
    70% { box-shadow: 0 0 0 10px rgba(62,207,142,0); }
    100% { box-shadow: 0 0 0 0 rgba(62,207,142,0); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
  <div class="wordmark"><span class="dot"></span>FITMEDIC</div>
  <h1>Something great<br>is on the way.</h1>
  <p class="tagline">We're putting the finishing touches on things. Check back soon — or reach out at <a class="mail" href="mailto:support@fitmedic.com">support@fitmedic.com</a>.</p>
  <div class="pill"><span class="pulse"></span>Coming soon</div>
  <footer>&copy; <span id="y"></span> FitMedic</footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
